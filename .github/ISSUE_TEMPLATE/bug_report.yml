name: Bug report
description: Something in Adamant doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm dev`
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - API
        - Worker / agent
        - Sandbox
        - Build / tooling
        - Docs
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and platform
      description: Shown in the app's Runtime panel.
      placeholder: 0.1.0 (dev), darwin arm64, Electron 44
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output only. Remove tokens and secrets.
      render: shell
